<!DOCTYPE html>
<html>
<head>
    <title>Tarkov Woods HD</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #00ff00;
            font-family: 'Courier New', monospace; pointer-events: none; 
            background: rgba(0,0,0,0.8); padding: 12px; border: 1px solid #333;
            z-index: 10; line-height: 1.4;
        }
        .key-hint { color: #00ffff; font-weight: bold; }
        .close-btn:hover { color: #ff0000; }
    </style>
</head>
<body> 
    <div id="modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#2d2d2d; border:1px solid #444; border-radius:8px; width:300px; padding:15px; z-index:100; color:white; font-family:Arial, sans-serif; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <b id="modal-title" style="font-size:20px; color:#e0b47a;">Заголовок</b>
            <span class="close-btn" onclick="closeModal()" style="cursor:pointer; font-size:24px;">&times;</span>
        </div>
        <img id="modal-img" src="" style="width:100%; border-radius:4px; margin-bottom:10px; display:none;">
        <div id="modal-desc" style="font-size:14px; color:#ccc;"></div>
    </div>

    <div id="info">
        WOODS HD | <span class="key-hint">R</span> - Линейка | Зум: Колесико<br>
        <span id="coord-label">Движение: ЛКМ</span>
    </div>
    <canvas id="mapCanvas"></canvas>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    const mapW = 25088, mapH = 22528, tileSize = 512;
    let scale = 0.08; 
    let offsetX = 0, offsetY = 0;
    const tiles = {}; 
    const loadedIcons = {};

    const minScale = 0.04; 
    const maxScale = 1.2;

    let isRulerMode = false;
    let rulerPoints = [];

    const overviewImg = new Image();
    overviewImg.src = 'map_overview.jpg';

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    // ТВОЯ ПОЛНАЯ БАЗА МЕТОК
    const markers = [
        { x: 4983, y: 20965, label: "Выход: Окраины", type: "exit_pmc" },
        { x: 2821, y: 15886, label: "Выход: ЗБ-014", type: "exit_pmc" },
        { x: 2878, y: 14209, label: "Выход: Проход у ЛЭП", type: "exit_pmc" },
        { x: 18911, y: 6664, label: "Выход: А-Выход на мосту", type: "exit_pmc" },
        { x: 20054, y: 13917, label: "Выход: Северный пост ООН", type: "exit_pmc" },
        { x: 17122, y: 15952, label: "Выход: ЗБ-016", type: "exit_pmc" },
        { x: 19441, y: 19896, label: "Выход: Южный ООН", type: "exit_both" },
        { x: 13037, y: 21998, label: "Выход: Ворота ВС РФ", type: "exit_both" },
        { x: 4946, y: 21629, label: "Выход: Окраины", type: "exit_scav" },
        { x: 3870, y: 19098, label: "Выход: Изба Диких", type: "exit_scav" },
        { x: 7440, y: 19691, label: "Выход: Убежище Мертвеца", type: "exit_scav" },
        { x: 7662, y: 18750, label: "Выход: Лодка", type: "exit_scav" },
        { x: 6183, y: 3162, label: "Выход: Бункер Диких", type: "exit_scav" },
        { x: 14223, y: 11583, label: "Выход: Горный Тайник", type: "exit_scav" },
        { x: 19257, y: 14487, label: "Выход: Восточные скалы", type: "exit_scav" },
        { x: 19384, y: 17609, label: "Выход: Склад депо", type: "exit_scav" },
        { x: 10387, y: 14687, label: "Штурман", type: "boss_shturman.png" }, 

        // СПАВНЫ ЧВК
        { x: 4585, y: 3499, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 4717, y: 5488, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 4140, y: 8778, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 7027, y: 10058, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 4624, y: 13982, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 4002, y: 15280, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 2961, y: 20085, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 6832, y: 20166, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 13771, y: 22113, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 16789, y: 19251, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 16378, y: 18600, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 19384, y: 19913, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 19581, y: 17711, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 19204, y: 16668, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 19029, y: 14237, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 16441, y: 13122, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 19289, y: 12551, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 15001, y: 11919, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 21119, y: 9360, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 18026, y: 6639, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 15401, y: 5160, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 11828, y: 5520, label: "Спавн ЧВК", type: "spawn_pmc.png" },
        { x: 9771, y: 4382, label: "Спавн ЧВК", type: "spawn_pmc.png" },

        // ПРИМЕРЫ ДЛЯ ДИКИХ (Добавь свои координаты здесь)
        { x: 12000, y: 14000, label: "Дикие", type: "spawn_scav.png" }
    ];

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        offsetX = canvas.width / 2 - (mapW * scale) / 2;
        offsetY = canvas.height / 2 - (mapH * scale) / 2;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (overviewImg.complete) ctx.drawImage(overviewImg, offsetX, offsetY, mapW * scale, mapH * scale);
        if (scale > 0.07) {
            const sX = Math.floor(Math.max(0, -offsetX / scale / tileSize));
            const sY = Math.floor(Math.max(0, -offsetY / scale / tileSize));
            const eX = Math.ceil((canvas.width - offsetX) / scale / tileSize);
            const eY = Math.ceil((canvas.height - offsetY) / scale / tileSize);
            for (let py = sY; py <= eY; py++) {
                for (let px = sX; px <= eX; px++) {
                    const tx = px * tileSize, ty = py * tileSize;
                    if (tx < mapW && ty < mapH) {
                        const name = `tile_${ty}_${tx}`;
                        if (tiles[name] && tiles[name] !== "loading") {
                            ctx.drawImage(tiles[name], offsetX + tx * scale, offsetY + ty * scale, tileSize * scale + 0.6, tileSize * scale + 0.6);
                        } else if (!tiles[name]) {
                            const img = new Image(); img.src = `tiles_ultra/${name}.jpg`;
                            img.onload = () => { tiles[name] = img; draw(); };
                            tiles[name] = "loading";
                        }
                    }
                }
            }
        }
        drawMarkers(); drawRuler();
    }

    function drawMarkers() {
        markers.forEach(m => {
            const sX = offsetX + m.x * scale;
            const sY = offsetY + m.y * scale;

            if (m.type.includes('.png')) {
                if (!loadedIcons[m.type]) {
                    loadedIcons[m.type] = new Image();
                    loadedIcons[m.type].src = `icons/markers/${m.type}`;
                    loadedIcons[m.type].onload = () => draw();
                }
                const img = loadedIcons[m.type];
                if (img.complete) {
                    const size = 32 * (scale < 0.1 ? 0.8 : 1.2);
                    ctx.drawImage(img, sX - size/2, sY - size/2, size, size);
                    // ТЕКСТ НЕ РИСУЕМ для Штурмана, Спавнов ЧВК и Диких
                    const silent = ["boss_shturman.png", "spawn_pmc.png", "spawn_scav.png"];
                    if (!silent.includes(m.type)) {
                        ctx.font = "bold 12px Arial"; ctx.fillStyle = "white"; ctx.strokeStyle = "black"; ctx.lineWidth = 2;
                        ctx.strokeText(m.label, sX - ctx.measureText(m.label).width/2, sY + size/2 + 12);
                        ctx.fillText(m.label, sX - ctx.measureText(m.label).width/2, sY + size/2 + 12);
                    }
                }
                return;
            }

            const cP = "#00ff00", cS = "#ff8c00", cB = "#ffff00";
            let isB = (m.type === "exit_both" || m.label.includes("Южный ООН") || m.label.includes("Ворота ВС РФ"));
            const iS = 24 * (scale < 0.1 ? 0.8 : 1.1); 
            const pI = 'extract_pmc.png', sI = 'extract_scav.png';
            if (!loadedIcons[pI]) { loadedIcons[pI] = new Image(); loadedIcons[pI].src = `icons/markers/${pI}`; loadedIcons[pI].onload = () => draw(); }
            if (!loadedIcons[sI]) { loadedIcons[sI] = new Image(); loadedIcons[sI].src = `icons/markers/${sI}`; loadedIcons[sI].onload = () => draw(); }

            if (isB) {
                if (loadedIcons[pI].complete) ctx.drawImage(loadedIcons[pI], sX - iS - 2, sY - iS/2, iS, iS);
                if (loadedIcons[sI].complete) ctx.drawImage(loadedIcons[sI], sX + 2, sY - iS/2, iS, iS);
            } else {
                const active = m.type === "exit_pmc" ? loadedIcons[pI] : loadedIcons[sI];
                if (active.complete) ctx.drawImage(active, sX - iS/2, sY - iS/2, iS, iS);
            }

            ctx.font = "bold 14px Arial";
            const tw = ctx.measureText(m.label).width, rX = sX + (isB ? iS : iS/2) + 5, rY = sY - 10;
            let mC = m.type === "exit_pmc" ? cP : (m.type === "exit_scav" ? cS : cB);
            ctx.fillStyle = isB ? cP : mC; ctx.fillRect(rX, rY, isB ? (tw+12)/2 : tw+12, 20);
            if(isB) { ctx.fillStyle = cS; ctx.fillRect(rX + (tw+12)/2, rY, (tw+12)/2, 20); }
            ctx.fillStyle = "#000"; ctx.fillText(m.label, rX + 6, rY + 15);
        });
    }

    function drawRuler() {
        if (!isRulerMode || rulerPoints.length === 0) return;
        ctx.lineWidth = 3; ctx.strokeStyle = "#00ffff"; ctx.setLineDash([10, 5]);
        const p1 = { x: offsetX + rulerPoints[0].x * scale, y: offsetY + rulerPoints[0].y * scale };
        ctx.beginPath(); ctx.arc(p1.x, p1.y, 5, 0, Math.PI * 2); ctx.stroke(); ctx.moveTo(p1.x, p1.y);
        if (rulerPoints.length === 2) {
            const p2 = { x: offsetX + rulerPoints[1].x * scale, y: offsetY + rulerPoints[1].y * scale };
            ctx.lineTo(p2.x, p2.y); ctx.stroke();
            const dist = Math.round(Math.sqrt(Math.pow(rulerPoints[1].x - rulerPoints[0].x, 2) + Math.pow(rulerPoints[1].y - rulerPoints[0].y, 2)) * 0.15);
            ctx.setLineDash([]); ctx.font = "bold 20px Arial"; ctx.fillStyle = "#00ffff";
            ctx.strokeText(dist + " м", (p1.x + p2.x)/2, (p1.y + p2.y)/2); ctx.fillText(dist + " м", (p1.x + p2.x)/2, (p1.y + p2.y)/2);
        }
        ctx.setLineDash([]);
    }

    let isDragging = false, lastX, lastY;
    canvas.onmousedown = (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; };
    window.onmouseup = () => isDragging = false;
    window.onmousemove = (e) => {
        if (isDragging) { offsetX += e.clientX - lastX; offsetY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; draw(); }
    };

    canvas.onwheel = (e) => {
        e.preventDefault(); const delta = e.deltaY > 0 ? 0.88 : 1.12; const newScale = scale * delta;
        if (newScale >= minScale && newScale <= maxScale) { offsetX -= (e.clientX - offsetX) * (delta - 1); offsetY -= (e.clientY - offsetY) * (delta - 1); scale = newScale; draw(); }
    };

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 'к') {
            isRulerMode = !isRulerMode; rulerPoints = [];
            document.getElementById('coord-label').innerHTML = isRulerMode ? "РЕЖИМ ЛИНЕЙКИ" : "Движение: ЛКМ";
            draw();
        }
    });

    canvas.onclick = (e) => {
        const mX = Math.round((e.clientX - offsetX) / scale);
        const mY = Math.round((e.clientY - offsetY) / scale);
        
        markers.forEach(m => {
            const dist = Math.sqrt(Math.pow(m.x - mX, 2) + Math.pow(m.y - mY, 2));
            if (dist < 35) {
                const mT = document.getElementById('modal-title');
                const mI = document.getElementById('modal-img');
                const mD = document.getElementById('modal-desc');
                if (m.type === "boss_shturman.png") {
                    mT.innerText = "Штурман"; mI.src = "shturman_photo.jpg"; mI.style.display = "block";
                    mD.innerHTML = "<p><b>Штурман</b></p><p><a href='#' style='color:#aaa;'>Гайд по бою...</a></p><p style='color:#666;'>03.07.22</p>";
                    document.getElementById('modal').style.display = 'block';
                } else if (m.type === "spawn_pmc.png") {
                    mT.innerText = "Спавн ЧВК"; mI.style.display = "none"; mD.innerHTML = "<p>Точка появления игроков ЧВК.</p>";
                    document.getElementById('modal').style.display = 'block';
                } else if (m.type === "spawn_scav.png") {
                    mT.innerText = "Дикие"; mI.style.display = "none"; mD.innerHTML = "<p>Место обитания Диких.</p>";
                    document.getElementById('modal').style.display = 'block';
                }
            }
        });

        if (isRulerMode) { if (rulerPoints.length >= 2) rulerPoints = []; rulerPoints.push({x: mX, y: mY}); draw(); }
        else { document.getElementById('coord-label').innerHTML = `Координаты: X: ${mX}, Y: ${mY}`; }
    };

    window.onresize = init; overviewImg.onload = draw; init();
</script>
</body>
</html>
