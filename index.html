<!DOCTYPE html>
<html>
<head>
    <title>Tarkov Woods HD</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #00ff00;
            font-family: 'Courier New', monospace; pointer-events: none; 
            background: rgba(0,0,0,0.8); padding: 12px; border: 1px solid #333;
            z-index: 10; line-height: 1.4;
        }
        .key-hint { color: #00ffff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">
        WOODS HD | <span class="key-hint">R</span> - Линейка | Зум: Колесико<br>
        <span id="coord-label">Движение: ЛКМ</span>
    </div>
    <canvas id="mapCanvas"></canvas>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    const mapW = 25088, mapH = 22528, tileSize = 512;
    let scale = 0.08; 
    let offsetX = 0, offsetY = 0;
    const tiles = {}; 
    const loadedIcons = {};

    const minScale = 0.04; 
    const maxScale = 1.2;

    let isRulerMode = false;
    let rulerPoints = [];

    const overviewImg = new Image();
    overviewImg.src = 'map_overview.jpg';

    // --- ПОЛНАЯ БАЗА ДАННЫХ МЕТОК (БЕЗ ПОТЕРЬ) ---
    const markers = [
        { x: 4983, y: 20965, label: "Выход: Окраины", type: "exit_pmc" },
        { x: 2821, y: 15886, label: "Выход: ЗБ-014", type: "exit_pmc" },
        { x: 2878, y: 14209, label: "Выход: Проход у ЛЭП", type: "exit_pmc" },
        { x: 18911, y: 6664, label: "Выход: А-Выход на мосту", type: "exit_pmc" },
        { x: 20054, y: 13917, label: "Выход: Северный пост ООН", type: "exit_pmc" },
        { x: 17122, y: 15952, label: "Выход: ЗБ-016", type: "exit_pmc" },
        { x: 19441, y: 19896, label: "Выход: Южный ООН", type: "exit_both" },
        { x: 13037, y: 21998, label: "Выход: Ворота ВС РФ", type: "exit_both" },
        { x: 4946, y: 21629, label: "Выход: Окраины", type: "exit_scav" },
        { x: 3870, y: 19098, label: "Выход: Изба Диких", type: "exit_scav" },
        { x: 7440, y: 19691, label: "Выход: Убежище Мертвеца", type: "exit_scav" },
        { x: 7662, y: 18750, label: "Выход: Лодка", type: "exit_scav" },
        { x: 6183, y: 3162, label: "Выход: Бункер Диких", type: "exit_scav" },
        { x: 14223, y: 11583, label: "Выход: Горный Тайник", type: "exit_scav" },
        { x: 19257, y: 14487, label: "Выход: Восточные скалы", type: "exit_scav" },
        { x: 19384, y: 17609, label: "Выход: Склад депо", type: "exit_scav" },
        { x: 19780, y: 13850, label: "Дом Диких", type: "interest" },
        { x: 12580, y: 10950, label: "Лесопилка", type: "boss_shturman.png" }, // Пример иконки
    ];

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        offsetX = canvas.width / 2 - (mapW * scale) / 2;
        offsetY = canvas.height / 2 - (mapH * scale) / 2;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;

        if (overviewImg.complete) {
            ctx.drawImage(overviewImg, offsetX, offsetY, mapW * scale, mapH * scale);
        }

        if (scale > 0.07) {
            const startX = Math.floor(Math.max(0, -offsetX / scale / tileSize));
            const startY = Math.floor(Math.max(0, -offsetY / scale / tileSize));
            const endX = Math.ceil((canvas.width - offsetX) / scale / tileSize);
            const endY = Math.ceil((canvas.height - offsetY) / scale / tileSize);

            for (let py = startY; py <= endY; py++) {
                for (let px = startX; px <= endX; px++) {
                    const tx = px * tileSize;
                    const ty = py * tileSize;
                    if (tx < mapW && ty < mapH) {
                        const name = `tile_${ty}_${tx}`;
                        const screenX = offsetX + tx * scale;
                        const screenY = offsetY + ty * scale;
                        if (tiles[name] && tiles[name] !== "loading") {
                            ctx.drawImage(tiles[name], screenX, screenY, tileSize * scale + 0.6, tileSize * scale + 0.6);
                        } else if (!tiles[name]) {
                            const img = new Image();
                            img.src = `tiles_ultra/${name}.jpg`;
                            img.onload = () => { tiles[name] = img; draw(); };
                            tiles[name] = "loading";
                        }
                    }
                }
            }
        }
        drawMarkers();
        drawRuler();
    }

    function drawMarkers() {
    markers.forEach(m => {
        const screenX = offsetX + m.x * scale;
        const screenY = offsetY + m.y * scale;

        // 1. ЛОГИКА ДЛЯ ПРЕДМЕТОВ И БОССОВ (как и была)
        if (m.type.includes('.png') || m.type.includes('.webp')) {
            if (!loadedIcons[m.type]) {
                loadedIcons[m.type] = new Image();
                const folder = m.type.endsWith('.webp') ? 'items' : 'markers';
                loadedIcons[m.type].src = `icons/${folder}/${m.type}`;
                loadedIcons[m.type].onload = () => draw();
            }
            const img = loadedIcons[m.type];
            if (img.complete) {
                const size = 32 * (scale < 0.1 ? 0.8 : 1.2);
                ctx.drawImage(img, screenX - size/2, screenY - size/2, size, size);
                ctx.font = "bold 12px Arial";
                ctx.fillStyle = "white"; ctx.strokeStyle = "black"; ctx.lineWidth = 2;
                ctx.strokeText(m.label, screenX - ctx.measureText(m.label).width/2, screenY + size/2 + 12);
                ctx.fillText(m.label, screenX - ctx.measureText(m.label).width/2, screenY + size/2 + 12);
            }
            return;
        }

        // 2. ЛОГИКА ДЛЯ ВЫХОДОВ С ДВОЙНЫМИ ИКОНКАМИ
        const colorPMC = "#00ff00", colorScav = "#ff8c00", colorBoth = "#ffff00";
        let isBoth = (m.type === "exit_both" || m.label.includes("Южный ООН") || m.label.includes("Ворота ВС РФ"));
        
        const iconSize = 24 * (scale < 0.1 ? 0.8 : 1.1); // Размер иконок на карте

        // Загружаем нужные иконки
        const pmcIconName = 'extract_pmc.png';
        const scavIconName = 'extract_scav.png';

        if (!loadedIcons[pmcIconName]) { loadedIcons[pmcIconName] = new Image(); loadedIcons[pmcIconName].src = `icons/markers/${pmcIconName}`; loadedIcons[pmcIconName].onload = () => draw(); }
        if (!loadedIcons[scavIconName]) { loadedIcons[scavIconName] = new Image(); loadedIcons[scavIconName].src = `icons/markers/${scavIconName}`; loadedIcons[scavIconName].onload = () => draw(); }

        // --- РИСУЕМ ИКОНКИ ВМЕСТО ТОЧЕК ---
        if (isBoth) {
            // Рисуем две иконки рядом
            if (loadedIcons[pmcIconName].complete) {
                ctx.drawImage(loadedIcons[pmcIconName], screenX - iconSize - 2, screenY - iconSize/2, iconSize, iconSize);
            }
            if (loadedIcons[scavIconName].complete) {
                ctx.drawImage(loadedIcons[scavIconName], screenX + 2, screenY - iconSize/2, iconSize, iconSize);
            }
        } else {
            // Рисуем одну иконку (ЧВК или Дикий)
            const activeIcon = m.type === "exit_pmc" ? loadedIcons[pmcIconName] : loadedIcons[scavIconName];
            if (activeIcon.complete) {
                ctx.drawImage(activeIcon, screenX - iconSize/2, screenY - iconSize/2, iconSize, iconSize);
            }
        }

        // --- РИСУЕМ ТВОИ ПЛАШКИ С ТЕКСТОМ (БЕЗ ИЗМЕНЕНИЙ) ---
        ctx.font = "bold 14px Arial";
        const textWidth = ctx.measureText(m.label).width;
        const padding = 6;
        const rectW = textWidth + padding * 2;
        const rectH = 20;
        const rX = screenX + (isBoth ? iconSize : iconSize/2) + 5; // Смещаем плашку чуть вправо от иконок
        const rY = screenY - 10;

        let mColor = m.type === "exit_pmc" ? colorPMC : (m.type === "exit_scav" ? colorScav : colorBoth);

        if (isBoth) {
            ctx.fillStyle = colorPMC; ctx.fillRect(rX, rY, rectW / 2, rectH);
            ctx.fillStyle = colorScav; ctx.fillRect(rX + rectW / 2, rY, rectW / 2, rectH);
            ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.strokeRect(rX, rY, rectW, rectH);
        } else {
            ctx.fillStyle = mColor; ctx.fillRect(rX, rY, rectW, rectH);
            ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.strokeRect(rX, rY, rectW, rectH);
        }

        ctx.fillStyle = "#000000"; 
        ctx.fillText(m.label, rX + padding, rY + 15);
    });
}

    function drawRuler() {
        if (!isRulerMode || rulerPoints.length === 0) return;
        ctx.lineWidth = 3; ctx.strokeStyle = "#00ffff"; ctx.setLineDash([10, 5]);
        const p1 = { x: offsetX + rulerPoints[0].x * scale, y: offsetY + rulerPoints[0].y * scale };
        ctx.beginPath(); ctx.arc(p1.x, p1.y, 5, 0, Math.PI * 2); ctx.stroke(); ctx.moveTo(p1.x, p1.y);
        if (rulerPoints.length === 2) {
            const p2 = { x: offsetX + rulerPoints[1].x * scale, y: offsetY + rulerPoints[1].y * scale };
            ctx.lineTo(p2.x, p2.y); ctx.stroke();
            const dist = Math.round(Math.sqrt(Math.pow(rulerPoints[1].x - rulerPoints[0].x, 2) + Math.pow(rulerPoints[1].y - rulerPoints[0].y, 2)) * 0.15);
            ctx.setLineDash([]); ctx.font = "bold 20px Arial"; ctx.fillStyle = "#00ffff";
            ctx.strokeText(dist + " м", (p1.x + p2.x)/2, (p1.y + p2.y)/2);
            ctx.fillText(dist + " м", (p1.x + p2.x)/2, (p1.y + p2.y)/2);
        }
        ctx.setLineDash([]);
    }

    // --- УПРАВЛЕНИЕ ---
    let isDragging = false, lastX, lastY;
    canvas.onmousedown = (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; };
    window.onmouseup = () => isDragging = false;
    window.onmousemove = (e) => {
        if (!isDragging) return;
        offsetX += e.clientX - lastX; offsetY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY; draw();
    };

    canvas.onwheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.88 : 1.12;
        const newScale = scale * delta;
        if (newScale >= minScale && newScale <= maxScale) {
            offsetX -= (e.clientX - offsetX) * (delta - 1);
            offsetY -= (e.clientY - offsetY) * (delta - 1);
            scale = newScale; draw();
        }
    };

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 'к') {
            isRulerMode = !isRulerMode; rulerPoints = [];
            document.getElementById('coord-label').innerHTML = isRulerMode ? "РЕЖИМ ЛИНЕЙКИ ВКЛЮЧЕН" : "Движение: ЛКМ";
            draw();
        }
    });

    canvas.onclick = (e) => {
        const mapX = Math.round((e.clientX - offsetX) / scale);
        const mapY = Math.round((e.clientY - offsetY) / scale);
        if (isRulerMode) {
            if (rulerPoints.length >= 2) rulerPoints = [];
            rulerPoints.push({x: mapX, y: mapY}); draw();
        } else {
            document.getElementById('coord-label').innerHTML = `Координаты: X: ${mapX}, Y: ${mapY}`;
        }
    };

    window.onresize = init;
    overviewImg.onload = draw;
    init();
</script>
</body>
</html>
